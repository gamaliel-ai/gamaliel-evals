# Minimal config to run only theology_compliance tests (for DRY validation).
# Same providers and defaultTest as main config.
# Run: bunx promptfoo eval -c eval/configs/chat-theology-only.yaml --filter-providers local -j 50
description: Chat evals – theology only (validation)

prompts:
  - "{{ prompt }}"

evaluateOptions:
  maxConcurrency: 50

providers:
  - id: openai:chat:gpt-5.6-luna:local
    provider: openai:chat:gpt-5.6-luna
    config:
      apiBaseUrl: "http://api.localhost:8000/v1"
      passthrough:
        model: gpt-5.6-luna
        theology: "{{ theology }}"
        profile: "{{ profile }}"
        bible_id: "{{ bible_id }}"

defaultTest:
  # Grade every llm-rubric with the same model the API is asked to use.
  options:
    provider: openai:chat:gpt-5.6-luna
  vars:
    prompt: "What does the Bible say about love?"
    theology: default
    profile: read_regularly
    bible_id: eng-web

tests:
  - file://../tests/theology_compliance.yaml
