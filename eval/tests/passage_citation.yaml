# Passage citation – ported from evals/chat_agent/test_cases/passage_citation.json
# Assertions: contains/icontains for specific verses; llm-rubric for thematic (min count, must_include_book).
# --- Specific verse lookups (expected_passages) ---
- description: Specific verse lookup - should cite the exact verse asked about
  vars:
    prompt: "What is John 3:16?"
  assert:
    - type: icontains
      value: "John 3:16"

- description: Verse range lookup - should cite the passage
  vars:
    prompt: "Tell me about Matthew 5:3-12"
  assert:
    - type: icontains
      value: "Matthew 5"

- description: Specific verse question - should cite Romans 8:28
  vars:
    prompt: "What does Romans 8:28 say?"
  assert:
    - type: icontains
      value: "Romans 8:28"

# --- Thematic: min_passage_count only ---
- description: Thematic question about love - should cite multiple relevant scriptures
  vars:
    prompt: "What does the Bible say about love?"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 2 distinct Bible passages (book and chapter/verse, e.g. John 3:16 or 1 Corinthians 13). Score 1.0 if at least 2 such citations appear, 0 otherwise."

- description: Thematic question about forgiveness - should cite relevant scripture
  vars:
    prompt: "Tell me about forgiveness"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 2 distinct Bible passages (book and chapter/verse). Score 1.0 if at least 2 such citations appear, 0 otherwise."

- description: Thematic question about prayer - should cite multiple passages
  vars:
    prompt: "What does the Bible teach about prayer?"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 2 distinct Bible passages (book and chapter/verse). Score 1.0 if at least 2 such citations appear, 0 otherwise."

- description: Thematic question about faith - should cite relevant scripture
  vars:
    prompt: "What is faith according to the Bible?"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 1 distinct Bible passage (book and chapter/verse). Score 1.0 if at least 1 such citation appears, 0 otherwise."

- description: Thematic question about grace - should cite multiple passages
  vars:
    prompt: "What does the Bible say about grace?"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 2 distinct Bible passages (book and chapter/verse). Score 1.0 if at least 2 such citations appear, 0 otherwise."

# --- Thematic with must_include_book ---
- description: Old Testament thematic question - should cite Genesis
  vars:
    prompt: "What does the Old Testament say about creation?"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 1 Bible passage and must include at least one citation from the book of Genesis. Score 1.0 if both conditions are met, 0 otherwise."

- description: Old Testament prophecy question - should cite multiple passages
  vars:
    prompt: "What are some Old Testament prophecies about the Messiah?"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 2 distinct Bible passages (book and chapter/verse). Score 1.0 if at least 2 such citations appear, 0 otherwise."

- description: New Testament question about Jesus - should cite Gospels
  vars:
    prompt: "What does Jesus teach about prayer?"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 2 distinct Bible passages and must include at least one citation from Matthew, Luke, or John. Score 1.0 if both conditions are met, 0 otherwise."

- description: New Testament question about parables - should cite Gospel passages
  vars:
    prompt: "What are some parables Jesus told?"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 2 distinct Bible passages and must include at least one citation from Matthew or Luke. Score 1.0 if both conditions are met, 0 otherwise."

- description: Cross-reference question - should cite multiple related passages
  vars:
    prompt: "What verses relate to John 3:16?"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 3 distinct Bible passages (book and chapter/verse) that relate to or complement John 3:16. Score 1.0 if at least 3 such citations appear, 0 otherwise."

- description: Thematic question - should cite passages from multiple books
  vars:
    prompt: "What does the Bible teach about forgiveness?"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 2 distinct Bible passages (book and chapter/verse). Score 1.0 if at least 2 such citations appear, 0 otherwise."

# --- Psalms: use original evaluation_criteria ---
- description: Psalms question - should cite Psalm passages about God's love
  vars:
    prompt: "What are some psalms about God's love?"
  assert:
    - type: llm-rubric
      value: "Evaluate whether the agent cited relevant Psalm passages about God's love. The response should cite at least one Psalm (can be singular 'Psalm' or plural 'Psalms' in the citation). The cited passages should be relevant to the theme of God's love. A psalm is considered relevant if it relates to God's love, mercy, kindness, faithfulness, compassion, care, or protection of His people. The agent should explain how the cited psalm relates to God's love. There are 150 psalms, and many of them express themes of God's love in various ways - do not penalize for citing psalms that are not commonly known, as long as the agent's explanation connects them to God's love. Give full credit (1.0) if the agent cites at least one psalm and provides a reasonable explanation connecting it to God's love, even if it's not one of the most famous psalms about love."

- description: Proverbs question - should cite multiple Proverbs passages
  vars:
    prompt: "What does Proverbs say about wisdom?"
  assert:
    - type: icontains
      value: "Proverb"
    - type: llm-rubric
      value: "The response must cite at least 2 distinct passages from the book of Proverbs (e.g. Proverbs 3:5, Proverbs 9:10). Score 1.0 if at least 2 such citations appear, 0 otherwise."

- description: Pauline epistles question - should cite Paul's letters
  vars:
    prompt: "What does Paul say about love in his letters?"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 1 passage from Paul's letters (Romans, 1 Corinthians, 1 Corinthians 13, or other Pauline epistles). Score 1.0 if at least 1 such citation appears, 0 otherwise."

- description: Character study - should cite multiple passages about David
  vars:
    prompt: "What does the Bible say about David?"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 2 distinct Bible passages and must include at least one citation from 1 Samuel, 2 Samuel, or Psalms. Score 1.0 if both conditions are met, 0 otherwise."

- description: Topical question about anxiety - should cite relevant scripture
  vars:
    prompt: "What does the Bible say about anxiety?"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 2 distinct Bible passages (book and chapter/verse). Score 1.0 if at least 2 such citations appear, 0 otherwise."

- description: Topical question about peace - should cite multiple passages
  vars:
    prompt: "What does the Bible say about peace?"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 2 distinct Bible passages (book and chapter/verse). Score 1.0 if at least 2 such citations appear, 0 otherwise."

- description: Comparison question - should cite passages from multiple Gospels
  vars:
    prompt: "How do the Gospels describe Jesus' birth?"
  assert:
    - type: llm-rubric
      value: "The response must cite at least 2 distinct Bible passages and must include at least one citation from Matthew or Luke. Score 1.0 if both conditions are met, 0 otherwise."
