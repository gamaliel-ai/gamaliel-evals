# Passage citation – ported from evals/chat_agent/test_cases/passage_citation.json
# Assertions: contains/icontains for specific verses; llm-rubric for thematic (min count, must_include_book).
# --- Specific verse lookups (expected_passages) ---
# For public API, we check for book/chapter references (more flexible than exact verse format)
- description: Specific verse lookup - should mention John 3
  vars:
    prompt: "What is John 3:16?"
  assert:
    - type: javascript
      value: "/john\\s+3/i.test(output) || /3:16/i.test(output)"

- description: Verse range lookup - should mention Matthew 5
  vars:
    prompt: "Tell me about Matthew 5:3-12"
  assert:
    - type: javascript
      value: "/matthew\\s+5/i.test(output)"

- description: Specific verse question - should mention Romans 8
  vars:
    prompt: "What does Romans 8:28 say?"
  assert:
    - type: javascript
      value: "/romans\\s+8/i.test(output) || /8:28/i.test(output)"

# --- Thematic: min_passage_count only ---
# For public API, we relax requirements - at least 1 citation is reasonable
- description: Thematic question about love - should cite at least one relevant scripture
  vars:
    prompt: "What does the Bible say about love?"
  assert:
    - type: llm-rubric
      value: "The response should cite at least 1 Bible passage (book and chapter/verse, e.g. John 3:16 or 1 Corinthians 13). Score 1.0 if at least 1 such citation appears, 0.5 if the response is relevant but lacks citations, 0 otherwise."

