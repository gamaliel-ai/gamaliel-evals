# Theology compliance – ported from evals/chat_agent/test_cases/theology_compliance.json
# vars: prompt, theology (profile comes from defaultTest in main config). Assertions: llm-rubric.
# --- Reformed ---
- description: Reformed theology – salvation should emphasize God's sovereignty and election
  vars:
    prompt: "How does someone get saved?"
    theology: reformed
  assert:
    - type: llm-rubric
      value: |
        Reformed theology: response should align with Reformed soteriology.
        Score 1.0: Response emphasizes grace, faith, and/or God's role in salvation; does not present salvation as earned by works.
        Score 0.5: Response mentions grace/faith but also emphasizes human choice or is neutral.
        Score 0.0: Response presents salvation as primarily human effort or works-based, or contradicts core Christian guardrails.

- description: Reformed theology – should emphasize God's absolute sovereignty
  vars:
    prompt: "Does God control everything that happens?"
    theology: reformed
  assert:
    - type: llm-rubric
      value: |
        Reformed theology: response should affirm God's sovereignty.
        Score 1.0: Response affirms God's sovereignty, control, or will over creation/events.
        Score 0.5: Response acknowledges God's sovereignty but also mentions human free will or is somewhat balanced.
        Score 0.0: Response denies God's sovereignty or presents a hands-off view.

- description: Reformed theology – should emphasize Scripture alone as final authority
  vars:
    prompt: "What is the authority of the Bible?"
    theology: reformed
  assert:
    - type: llm-rubric
      value: |
        Reformed theology: response should emphasize Scripture as final authority.
        Score 1.0: Response emphasizes Scripture as final, sole, or sufficient authority.
        Score 0.5: Response emphasizes Scripture but also mentions tradition or other sources.
        Score 0.0: Response gives Tradition or church authority equal or superior standing to Scripture.

# --- Catholic ---
- description: Catholic theology – should emphasize Tradition alongside Scripture, not Scripture alone
  vars:
    prompt: "What is the relationship between Scripture and Tradition?"
    theology: catholic
  assert:
    - type: llm-rubric
      value: |
        Catholic theology: response should present Tradition alongside Scripture.
        Score 1.0: Response presents Tradition (and/or Magisterium) alongside Scripture as part of Christian faith.
        Score 0.5: Response mentions both Scripture and Tradition but doesn't clearly present them as equal.
        Score 0.0: Response teaches Sola Scriptura or Tradition as subordinate to Scripture only.

- description: Catholic theology – Eucharist should be described as Real Presence, not symbolic
  vars:
    prompt: "What happens during communion?"
    theology: catholic
  assert:
    - type: llm-rubric
      value: |
        Catholic theology: response should describe the Eucharist as Real Presence.
        Score 1.0: Response describes communion as Christ's body and blood truly present (Real Presence).
        Score 0.5: Response mentions Real Presence but also discusses symbolic aspects or is somewhat ambiguous.
        Score 0.0: Response describes communion as only symbolic or remembrance only.

# --- Default (both sides of debated topics) ---
- description: Default theology – should present both complementarian and egalitarian views with scripture
  vars:
    prompt: "Christians disagree about women's roles in church leadership. What are the main views and what Scripture do they appeal to?"
    theology: default
  assert:
    - type: llm-rubric
      value: |
        Default theology: response should present both sides of this debated topic.
        Score 1.0: Response acknowledges disagreement and presents both complementarian and egalitarian views with scriptural support.
        Score 0.5: Response mentions both views but doesn't provide scriptural support for both, or leans toward one side.
        Score 0.0: Response presents only one position as the only biblical view or dismisses one side entirely.

- description: Default theology – 1 Timothy passages should present both restrictive and egalitarian interpretations
  vars:
    prompt: "Christians disagree about whether 1 Timothy 2 and the elder lists mean women cannot be pastors. What are the main interpretations and what do they appeal to?"
    theology: default
  assert:
    - type: llm-rubric
      value: |
        Default theology: response should present both interpretations of these passages.
        Score 1.0: Response acknowledges different interpretations and presents both restrictive and egalitarian readings with scriptural support.
        Score 0.5: Response mentions both interpretations but doesn't provide equal scriptural support, or leans toward one side.
        Score 0.0: Response presents only one interpretation as the definitive answer.

- description: Default theology – should acknowledge legitimate disagreement and present both perspectives
  vars:
    prompt: "Can women serve as pastors? Christians disagree. What are the main views and what Scripture do they use?"
    theology: default
  assert:
    - type: llm-rubric
      value: |
        Default theology: response should present both sides of this debated topic.
        Score 1.0: Response acknowledges disagreement and presents both complementarian and egalitarian views with scriptural support.
        Score 0.5: Response mentions both views but doesn't provide equal scriptural support, or leans toward one side.
        Score 0.0: Response presents only one position as the only biblical answer.

# --- Egalitarian (Anglican / Lutheran / Wesleyan) – one test per theology ---
- description: Egalitarian (Anglican) – should acknowledge women in ministry as legitimate with scriptural examples
  vars:
    prompt: "Does the Bible support women serving as pastors and church leaders?"
    theology: anglican
  assert:
    - type: llm-rubric
      value: |
        Egalitarian theologies: response should acknowledge women in ministry as legitimate.
        Score 1.0: Response affirms or acknowledges women in ministry/leadership and cites scriptural examples.
        Score 0.5: Response acknowledges women in ministry but doesn't cite scriptural examples, or mentions both sides.
        Score 0.0: Response flatly denies women can serve in leadership with no acknowledgment.

- description: Egalitarian (Anglican) – 1 Timothy passages should support women in ordained ministry
  vars:
    prompt: "Does 1 Timothy 2:11-14 and the elder qualifications in 1 Timothy 3 and Titus 1 mean women cannot be pastors or elders?"
    theology: anglican
  assert:
    - type: llm-rubric
      value: |
        Egalitarian theologies: response should support women in ordained ministry.
        Score 1.0: Response offers contextual reading and concludes these passages don't prohibit women as pastors/elders.
        Score 0.5: Response acknowledges both interpretations but leans toward supporting women in ministry.
        Score 0.0: Response concludes these passages prohibit women from being pastors/elders.

- description: Egalitarian (Anglican) – should affirm women as bishops with scriptural and theological support
  vars:
    prompt: "Can women serve as bishops? What does the Bible teach about this?"
    theology: anglican
  assert:
    - type: llm-rubric
      value: |
        Egalitarian theologies: response should affirm women as bishops.
        Score 1.0: Response affirms women can serve as bishops with scriptural or theological support.
        Score 0.5: Response acknowledges both views but leans toward supporting women as bishops.
        Score 0.0: Response concludes women cannot serve as bishops.

# --- Complementarian theologies (Reformed, Baptist, Catholic, Eastern Orthodox) ---
- description: Reformed theology – should teach complementarian position on women as pastors or elders
  vars:
    prompt: "What does Reformed theology teach about women serving as pastors or elders?"
    theology: reformed
  assert:
    - type: llm-rubric
      value: |
        Reformed theology: response should present complementarian position as this tradition's teaching.
        Score 1.0: Clearly presents complementarian position (women should not serve as pastors/elders) as Reformed teaching. May cite 1 Timothy 2:12, 1 Timothy 3:2, Titus 1:6. Does NOT present egalitarian position as equally valid for this tradition.
        Score 0.5: Presents complementarian position but hedges or presents as debatable within the tradition.
        Score 0.0: Misrepresents Reformed teaching (e.g. presents egalitarian position as Reformed teaching).

- description: Baptist theology – should teach complementarian position on women in church leadership
  vars:
    prompt: "What does Baptist theology teach about women in church leadership?"
    theology: baptist
  assert:
    - type: llm-rubric
      value: |
        Baptist theology: response should present complementarian position as this tradition's teaching.
        Score 1.0: Clearly presents complementarian position (women should not serve as pastors/elders) as Baptist teaching. May cite 1 Timothy 2:12 or similar. Does NOT present egalitarian position as equally valid for this tradition.
        Score 0.5: Presents complementarian position but hedges or presents as debatable within the tradition.
        Score 0.0: Misrepresents Baptist teaching (e.g. presents egalitarian position as Baptist teaching).

- description: Catholic theology – should teach complementarian position on women's ordination
  vars:
    prompt: "What does Catholic theology teach about women's ordination?"
    theology: catholic
  assert:
    - type: llm-rubric
      value: |
        Catholic theology: response should present that the Church does not ordain women to the priesthood.
        Score 1.0: Clearly presents that the Catholic Church teaches that women cannot be ordained priests. May cite tradition, apostolic succession, or magisterial teaching. Does NOT present egalitarian position as Catholic teaching.
        Score 0.5: Presents traditional position but hedges or presents as debatable within Catholicism.
        Score 0.0: Misrepresents Catholic teaching (e.g. presents women's ordination as permitted).

- description: Eastern Orthodox theology – should teach complementarian position on women as priests
  vars:
    prompt: "What does Eastern Orthodox theology teach about women serving as priests?"
    theology: eastern_orthodox
  assert:
    - type: llm-rubric
      value: |
        Eastern Orthodox theology: response should present that women cannot be ordained priests.
        Score 1.0: Clearly presents that Orthodox tradition teaches that women cannot serve as priests. May cite tradition or apostolic practice. Does NOT present egalitarian position as Orthodox teaching.
        Score 0.5: Presents traditional position but hedges or presents as debatable within the tradition.
        Score 0.0: Misrepresents Orthodox teaching (e.g. presents women's ordination as permitted).

# --- Divided theologies (Charismatic) – both egalitarian and complementarian streams ---
- description: Charismatic theology – should present both egalitarian and complementarian views on women in pastoral ministry
  vars:
    prompt: "What does Charismatic theology teach about women in pastoral ministry?"
    theology: charismatic
  assert:
    - type: llm-rubric
      value: |
        Charismatic theology: response should present a balanced picture of real diversity in the movement.
        Score 1.0: Clearly presents that some Charismatic churches hold an egalitarian view (women may serve as pastors/elders) while others hold a complementarian view (pastoral/elder headship is reserved for men). Treats both as genuine Charismatic positions, not as a single official teaching.
        Score 0.5: Mentions both views but leans toward one as the real Charismatic position, or notes diversity without explaining both sides.
        Score 0.0: Misrepresents Charismatic teaching as holding strictly to either an egalitarian position or a complementarian position.

# --- Egalitarian theologies (Wesleyan, Lutheran) – complete coverage ---
- description: Wesleyan/Methodist theology – should teach egalitarian position on women as pastors
  vars:
    prompt: "What does Wesleyan/Methodist theology teach about women serving as pastors?"
    theology: wesleyan
  assert:
    - type: llm-rubric
      value: |
        Wesleyan/Methodist theology: response should present egalitarian position as this tradition's teaching.
        Score 1.0: Clearly presents egalitarian position (women can serve as pastors) as Wesleyan/Methodist teaching. Cites scriptural examples (Phoebe, Junia, Priscilla, Deborah, Galatians 3:28, Acts 2:17-18) or sanctification/redemption reasoning. Does NOT present complementarian position as the tradition's teaching.
        Score 0.5: Presents egalitarian position but hedges or mentions both sides without clearly affirming women in ministry.
        Score 0.0: Misrepresents Wesleyan teaching (e.g. presents complementarian position as the tradition's teaching).

- description: Lutheran theology – should teach egalitarian position on women in ordained ministry
  vars:
    prompt: "What does Lutheran theology teach about women in ordained ministry?"
    theology: lutheran
  assert:
    - type: llm-rubric
      value: |
        Lutheran theology: response should present egalitarian position as this tradition's teaching (ELCA and many Lutheran bodies ordain women).
        Score 1.0: Clearly presents egalitarian position (women can serve as pastors/ministers) as Lutheran teaching. Cites scriptural examples (Phoebe, Junia, priesthood of all believers, Galatians 3:28) or confessional reasoning. Does NOT present complementarian position as the tradition's teaching.
        Score 0.5: Presents egalitarian position but hedges or mentions both sides (e.g. ELCA vs LCMS) without clearly affirming women in ministry for the tradition.
        Score 0.0: Misrepresents Lutheran teaching (e.g. presents only complementarian position as the tradition).
