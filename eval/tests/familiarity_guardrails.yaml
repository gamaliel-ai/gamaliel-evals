    theology: catholic
    profile: new_to_the_bible
  assert: &catholic_eucharist
    - type: llm-rubric
      threshold: 1.0
      value: |
        Only a score of 1.0 passes. A score of 0.5 or 0.0 fails.
        The profile is {{profile}} and the theology is Catholic. Familiarity may use plainer words. It must not turn the Eucharist into a symbol only.
        On New to the Bible, terms such as transubstantiation or Real Presence may be explained in everyday words. The claim must still be that Christ is truly present in the bread and wine, not merely remembered.
        Score 1.0 if communion is Christ's body and blood truly present.
        Score 0.5 if real presence is mentioned but mixed with a merely symbolic account.
        Score 0.0 if communion is only a symbol or a remembrance.

