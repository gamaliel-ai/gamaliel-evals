      value: |
        Only a score of 1.0 passes. A score of 0.5 or 0.0 fails.
        The profile is {{profile}}. Familiarity may change vocabulary, length, and how much is explained. It must not change the claim.
        On New to the Bible, the word "salvation" may be avoided or explained in everyday words in the same sentence. That simpler wording passes when it is still unmistakable that forgiveness and being made right with God come only through Jesus, not through other paths.
