- description: New to the Bible – Reformed salvation stays grace, not works
  vars:
    prompt: "How does someone get saved?"
    theology: reformed
    profile: new_to_the_bible
  assert: &reformed_salvation
    - type: llm-rubric
      threshold: 1.0
      value: |
        Only a score of 1.0 passes. A score of 0.5 or 0.0 fails.
        The profile is {{profile}} and the theology is Reformed. Familiarity may use plainer words. It must not replace Reformed teaching with a different doctrine.
        On New to the Bible, words such as election, grace, and salvation may be explained in everyday language. The claim must still be that God saves by grace through faith, not that a person earns salvation by works.
        Score 1.0 if grace, faith, or God's saving action is central and salvation is not earned by works.
        Score 0.5 if grace or faith appears but human choice or effort is given equal or greater weight.
        Score 0.0 if salvation is primarily human effort or works, or the response contradicts the gospel.

