- description: New to the Bible – Catholic teaching keeps Tradition with Scripture
  vars:
    prompt: "What is the relationship between Scripture and Tradition?"
    theology: catholic
    profile: new_to_the_bible
  assert: &catholic_tradition
    - type: llm-rubric
      threshold: 1.0
      value: |
        Only a score of 1.0 passes. A score of 0.5 or 0.0 fails.
        The profile is {{profile}} and the theology is Catholic. Familiarity may use plainer words. It must not flatten Catholic teaching into Scripture alone.
        Everyday explanations of Tradition or the Church's teaching office are allowed. The response must still present Tradition alongside Scripture.
        Score 1.0 if Tradition, or the Magisterium, stands alongside Scripture as part of Catholic faith.
        Score 0.5 if both are mentioned but Tradition is left unclear or subordinate.
        Score 0.0 if it teaches Scripture alone, or treats Tradition as only a human opinion under Scripture.

