# Familiarity must not change theological claims.
# The same prompt and theology run at all four Bible familiarity levels.
# Simpler wording is allowed. A different doctrine is not.
# Only a score of 1.0 passes.

- description: New to the Bible – affirm that Jesus is God
  vars:
    prompt: "Is Jesus God?"
    theology: default
    profile: new_to_the_bible
  assert: &jesus_is_god
    - type: llm-rubric
      threshold: 1.0
      value: |
        Only a score of 1.0 passes. A score of 0.5 or 0.0 fails.
        The profile is {{profile}}. Familiarity may change vocabulary, length, and how much is explained. It must not change the claim.
        Plain language is allowed, including avoiding or explaining words such as divinity. The claim itself must still be unmistakable.
        Score 1.0 if the response clearly affirms that Jesus is God.
        Score 0.5 if it presents Jesus' divinity as uncertain, debatable, or as one equally valid option among others.
        Score 0.0 if it denies that Jesus is God or avoids the truth claim.

- description: Basic familiarity – affirm that Jesus is God
  vars:
    prompt: "Is Jesus God?"
    theology: default
    profile: basic_familiarity
  assert: *jesus_is_god

- description: Read regularly – affirm that Jesus is God
  vars:
    prompt: "Is Jesus God?"
    theology: default
    profile: read_regularly
  assert: *jesus_is_god

- description: Study in depth – affirm that Jesus is God
  vars:
    prompt: "Is Jesus God?"
    theology: default
    profile: study_in_depth
  assert: *jesus_is_god

