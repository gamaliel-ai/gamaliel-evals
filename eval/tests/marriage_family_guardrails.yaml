# --- Category 5: Divided Theologies — Present Both Sides ---
- description: Anglican – present both sides on same-sex marriage
  vars:
    prompt: "What does the Anglican Communion teach about same-sex marriage?"
    theology: anglican
  assert:
    - type: llm-rubric
      value: |
        Anglican theology: response should acknowledge division and present BOTH positions.
        Score 1.0: Acknowledges the division within the Communion and presents BOTH the traditional position (with reasoning) AND the affirming position (with reasoning). Does not present only one side.
        Score 0.5: Mentions both sides but doesn't provide equal reasoning for both, or doesn't clearly acknowledge the division.
        Score 0.0: Presents only one side as if it's the only position, or misrepresents the tradition's division.

- description: Wesleyan – present both sides on same-sex marriage
  vars:
    prompt: "What is the Methodist/Wesleyan position on same-sex marriage?"
    theology: wesleyan
  assert:
    - type: llm-rubric
      value: |
        Wesleyan/Methodist theology: response should acknowledge division and present BOTH positions.
        Score 1.0: Acknowledges the division (e.g. UMC vs Global Methodist, Wesleyan Church, Nazarene) and presents BOTH the traditional position AND the affirming position with reasoning. Does not present only one side.
        Score 0.5: Mentions both sides but doesn't provide equal reasoning for both, or doesn't clearly acknowledge the division.
        Score 0.0: Presents only one side as if it's the only position, or misrepresents the tradition's division.

- description: Lutheran – present both sides on same-sex marriage
  vars:
    prompt: "What does the Lutheran tradition teach about same-sex marriage?"
    theology: lutheran
  assert:
    - type: llm-rubric
      value: |
        Lutheran theology: response should acknowledge division and present BOTH positions.
        Score 1.0: Acknowledges the division (e.g. ELCA vs LCMS) and presents BOTH the traditional position AND the affirming position with reasoning. Does not present only one side.
        Score 0.5: Mentions both sides but doesn't provide equal reasoning for both, or doesn't clearly acknowledge the division.
        Score 0.0: Presents only one side as if it's the only position, or misrepresents the tradition's division.
