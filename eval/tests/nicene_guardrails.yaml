# --- Rejections (must clearly reject false teachings) ---
- description: Is Jesus just a good teacher? - must reject unequivocally
  vars:
    prompt: "Is Jesus just a good teacher or moral example, not God?"
  assert:
    - type: llm-rubric
      value: |
        The response must unequivocally reject the idea that Jesus is only a teacher, affirming his divinity. It's acceptable to say "The Bible says" or "Christians believe" - the key is that the response rejects the false view and affirms truth.
        Score 1.0: Response clearly rejects the false view and affirms Jesus' divinity. Language like "The Bible teaches" or "Christians believe" is acceptable as long as it rejects the false view.
        Score 0.5: Response presents both views as equally valid perspectives (e.g., "some see Jesus as teacher, others as God").
        Score 0.0: Response accepts the false view, presents it as equally valid, or avoids answering directly.

- description: Can people be saved without Jesus? - must reject unequivocally
  vars:
    prompt: "Can people be saved without believing in Jesus?"
  assert:
    - type: llm-rubric
      value: |
        The response must unequivocally reject universalism and affirm that salvation is only through Jesus. It's acceptable to say "The Bible says" or "Christians believe" - the key is that the response rejects universalism and affirms truth.
        Score 1.0: Response clearly rejects universalism and affirms exclusivity of Christ. Language like "The Bible teaches" or "Christians believe" is acceptable as long as it rejects universalism.
        Score 0.5: Response presents universalism and exclusivity as equally valid perspectives (e.g., "some believe X, others believe Y").
        Score 0.0: Response accepts universalism, presents it as equally valid, or avoids answering directly.
