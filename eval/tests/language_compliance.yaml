# Language compliance – ported from evals/chat_agent/test_cases/language_compliance.json
# Each test sends a prompt with bible_id (translation context); we assert response is in the expected language.
# NOTE: For the API to respond in the right language, bible_id must be sent per request (passthrough).
# Current promptfoo may not template provider passthrough with test vars; if so, use static config or
# per-test provider override until supported. With static passthrough (no bible_id), API returns default language.
#
# Language detection uses llm-rubric for robustness (avoids brittle hardcoded word lists).
# Korean tests use JavaScript regex for Hangul script detection (reliable and fast).

# Spanish – spa-niv-2022; use LLM to detect Spanish language
- description: Spanish translation with English question – should respond in Spanish
  vars:
    prompt: "What does this verse mean? (max 20 words)"
    bible_id: spa-niv-2022
  assert:
    - type: llm-rubric
      value: "The response should be written entirely in Spanish. Score 1.0 if the response is clearly in Spanish, 0.5 if it's mostly Spanish with some English, 0 if it's primarily in English or another language."

- description: Spanish translation with Spanish question – should respond in Spanish
  vars:
    prompt: "¿Qué significa este versículo? (máximo 20 palabras)"
    bible_id: spa-niv-2022
  assert:
    - type: llm-rubric
      value: "The response should be written entirely in Spanish. Score 1.0 if the response is clearly in Spanish, 0.5 if it's mostly Spanish with some English, 0 if it's primarily in English or another language."

- description: Spanish translation with thematic English question – should respond in Spanish
  vars:
    prompt: "What does the Bible say about love? (max 20 words)"
    bible_id: spa-niv-2022
  assert:
    - type: llm-rubric
      value: "The response should be written entirely in Spanish. Score 1.0 if the response is clearly in Spanish, 0.5 if it's mostly Spanish with some English, 0 if it's primarily in English or another language."

# Korean – kor-niv-1985; require Korean script (Hangul)
- description: Korean translation with English question – should respond in Korean
  vars:
    prompt: "What does this verse teach about God's love? (max 20 words)"
    bible_id: kor-niv-1985
  assert:
    - type: javascript
      value: "/[\uAC00-\uD7AF]/.test(output)"

- description: Korean translation with Korean question – should respond in Korean
  vars:
    prompt: "이 구절이 하나님의 사랑에 대해 무엇을 가르치나요? (최대 20단어)"
    bible_id: kor-niv-1985
  assert:
    - type: javascript
      value: "/[\uAC00-\uD7AF]/.test(output)"

- description: Korean translation with thematic English question – should respond in Korean
  vars:
    prompt: "What does the Bible say about forgiveness? (max 20 words)"
    bible_id: kor-niv-1985
  assert:
    - type: javascript
      value: "/[\uAC00-\uD7AF]/.test(output)"

