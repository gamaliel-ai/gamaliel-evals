# User preference fallback (bible_id from user translation)
- description: User preferred translation (Portuguese) used as fallback when bible_id from preference
  vars:
    prompt: "O que este versículo ensina sobre o amor de Deus?"
    bible_id: por-niv-23
  providers: [openai:chat:gpt-4o-mini:por]
  assert:
    - type: contains
      value: Deus
    - type: contains
      value: amor
    - type: contains
      value: vida
    - type: contains
      value: para
    - type: contains
      value: que

- description: User preferred translation (Spanish) used as fallback when bible_id from preference
  vars:
    prompt: "¿Qué significa este versículo?"
    bible_id: spa-niv-2022
  providers: [openai:chat:gpt-4o-mini:spa]
  assert:
    - type: contains
      value: Dios
