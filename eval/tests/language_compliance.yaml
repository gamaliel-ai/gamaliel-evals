# User preference fallback (bible_id from user translation)
- description: User preferred translation (Portuguese) used as fallback when bible_id from preference
  vars:
    prompt: "O que este versículo ensina sobre o amor de Deus? (máximo 20 palavras)"
    bible_id: por-niv-23
  assert:
    - type: llm-rubric
      value: "The response should be written entirely in Portuguese. Score 1.0 if the response is clearly in Portuguese, 0.5 if it's mostly Portuguese with some English, 0 if it's primarily in English or another language."

- description: User preferred translation (Spanish) used as fallback when bible_id from preference
  vars:
    prompt: "¿Qué significa este versículo? (máximo 20 palabras)"
    bible_id: spa-niv-2022
  assert:
    - type: llm-rubric
      value: "The response should be written entirely in Spanish. Score 1.0 if the response is clearly in Spanish, 0.5 if it's mostly Spanish with some English, 0 if it's primarily in English or another language."

- description: User preferred translation (Korean) used as fallback when bible_id from preference
  vars:
    prompt: "이 구절이 무엇을 의미하나요? (최대 20단어)"
    bible_id: kor-niv-1985
  assert:
    - type: javascript
      value: "/[\uAC00-\uD7AF]/.test(output)"
