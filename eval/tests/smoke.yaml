# Smoke tests: quick validation tests for any environment.
# Uses brief prompts for faster responses.
# Run with: bunx promptfoo eval --tests eval/tests/smoke.yaml
# For staging: bunx promptfoo eval -c promptfooconfig.staging.yaml --tests eval/tests/smoke.yaml
# For local: bunx promptfoo eval -c promptfooconfig.local.yaml --tests eval/tests/smoke.yaml

- description: Response is non-empty – default theology
  vars:
    prompt: "What is love? (brief answer)"
  assert:
    - type: javascript
      value: "output.length > 0"
