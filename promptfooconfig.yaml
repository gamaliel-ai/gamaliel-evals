# Evals against Gamaliel Public API.
# One config: smoke + passage citation (and later theology, profile). Same tests, same assertions.
# Requires OPENAI_API_KEY in environment (or .env when run via `bun run eval` from repo root).
#
# Default: run against production only (commandLineOptions.filterProviders below).
# To run the same suite against local: --filter-providers local
#   e.g. bun run eval:local  or  bunx promptfoo eval --filter-providers local -j 50
#
# Language evals: eval/configs/chat-language.yaml (different providers per bible_id).

evaluateOptions:
  maxConcurrency: 50

description: Chat evals – smoke + passage citation (Gamaliel API)

prompts:
  - "{{ prompt }}"

# Fixed passthrough (promptfoo does not substitute {{ var }} in provider passthrough; API was receiving literal "{{ theology }}").
# Theology/profile suites (theology_compliance, profile_adaptation) need separate configs with one provider per theology/profile until promptfoo supports passthrough vars.
providers:
  - id: openai:chat:gpt-4o-mini:prod
    config:
      apiBaseUrl: "https://api.gamaliel.ai/v1"
      passthrough:
        theology: default
        profile: universal_explorer
        bible_id: eng-web
  - id: openai:chat:gpt-4o-mini:staging
    provider: openai:chat:gpt-4o-mini
    config:
      apiBaseUrl: "https://api.staging.gamaliel.ai/v1"
      passthrough:
        theology: default
        profile: universal_explorer
        bible_id: eng-web
  - id: openai:chat:gpt-4o-mini:local
    provider: openai:chat:gpt-4o-mini
    config:
      apiBaseUrl: "http://api.localhost:8000/v1"
      passthrough:
        model: gpt-4o-mini
        theology: default
        profile: universal_explorer
        bible_id: eng-web

defaultTest:
  vars:
    prompt: "What does the Bible say about love?"
    theology: default
    profile: universal_explorer
    bible_id: eng-web

# Run against prod by default: --filter-providers prod.
# Run against staging: --filter-providers staging
# Run against local: --filter-providers local

# Theology/profile tests excluded from main suite until we have per-test passthrough (e.g. one provider per theology).
tests:
  - file://eval/tests/smoke.yaml
  - file://eval/tests/passage_citation.yaml
