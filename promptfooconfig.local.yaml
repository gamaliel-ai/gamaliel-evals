# Evals against Gamaliel API on a local development server (Internal gamailel development use only).
# Full suite: passage citation, theology compliance, profile adaptation, language compliance.
# Requires OPENAI_API_KEY in environment and local backend running on api.localhost:8000.
# Run with: bunx promptfoo eval -c promptfooconfig.local.yaml -j 50

# Validate required environment variables before running tests
extensions:
  - file://eval/validate-env.js:extensionHook

evaluateOptions:
  maxConcurrency: 50

description: Chat evals – full suite (Gamaliel API Local - Internal)

prompts:
  - "{{ prompt }}"

# Local HTTP provider - uses template variables from test vars
providers:
  - id: "http://api.localhost:8000/v1/chat/completions"
    provider: http
    config:
      url: "http://api.localhost:8000/v1/chat/completions"
      method: POST
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer {{env.OPENAI_API_KEY}}"
      body:
        model: "gpt-4o-mini"
        messages:
          - role: "user"
            content: "{{ prompt }}"
        theology: "{{ theology | default('default') }}"
        profile: "{{ profile | default('universal_explorer') }}"
        bible_id: "{{ bible_id | default('eng-web') }}"
        stream: false
      transformResponse: "json.choices[0].message.content"

defaultTest:
  vars:
    prompt: "What does the Bible say about love?"
    theology: default
    profile: universal_explorer
    bible_id: eng-web

# Full test suite
tests:
  - file://eval/tests/passage_citation.yaml
  - file://eval/tests/theology_compliance.yaml
  - file://eval/tests/profile_adaptation.yaml
  - file://eval/tests/language_compliance.yaml
  - file://eval/tests/nicene_guardrails.yaml
